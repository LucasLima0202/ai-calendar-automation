name: Deploy to Trigger.dev (prod)

# Todo push na master faz deploy em produção.
# Secret necessário (Settings → Secrets and variables → Actions → Repository secrets):
#   TRIGGER_ACCESS_TOKEN = API key do ambiente Production com acesso "Deploy only"
#   (cloud.trigger.dev → API keys → New API key). Um token pessoal tr_pat_ também funciona.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Usa a versão do CLI fixada no package.json (a doc pede versões iguais no CI e no local).
      # --external-id liga o deploy ao commit e evita rebuild se o workflow rodar de novo.
      - name: 🚀 Deploy Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npm run deploy -- --external-id ${{ github.sha }}
